name: Sprint 5 backend checks
on:
  push:
    branches: [feat/sprint-5-productize]
  pull_request:
    branches: [main]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Productize and security regressions
        working-directory: backend
        run: python -m pytest -q tests/test_s5_productize.py tests/test_auth.py tests/test_security.py tests/test_s4_delivery.py
  angular:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Angular dependencies
        working-directory: frontend
        run: npm ci
      - name: Architecture and Sprint checks
        working-directory: frontend
        run: |
          npm run check:architecture
          npm run check:ui
          npm run check:session
          npm run check:interactions
          npm run check:sprint2
          npm run check:sprint3
          npm run check:sprint4
          npm run check:sprint5
      - name: Angular production build
        working-directory: frontend
        run: npm run build
