name: Sprint 5 backend checks
on:
  push:
    branches: [feat/sprint-5-productize]
  pull_request:
    branches: [main]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Productize and security regressions
        working-directory: backend
        run: python -m pytest -q tests/test_s5_productize.py tests/test_auth.py tests/test_security.py tests/test_s4_delivery.py
